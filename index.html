<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turk Tili Platformasi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f4f7f6; color: #333; padding: 20px; text-align: center; }
        header { background: #e74c3c; color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); font-weight: bold; }
        .card:hover { background: #ffe6e6; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>Turk Tili Ta'lim Platformasi</h1>
        <p>Barchasi bir joyda: Tarixdan zamonaviylikkacha</p>
    </header>

    <h2>Bo'limlar</h2>

    <div class="grid">
        <div class="card">🎧 Listening</div>
        <div class="card">📖 Reading</div>
        <div class="card">✍️ Writing</div>
        <div class="card">🗣️ Speaking</div>
        <div class="card">📚 Vocabulary</div>
        <div class="card">📝 Grammar</div>
        <div class="card">📜 Tarix</div>
        <div class="card">🏛️ 360° Turkiya</div>
    </div>

</body>
</html>
